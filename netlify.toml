[build]
  command = "npm run build"
  publish = "dist"

# Netlify also reads .nvmrc, but pinning here keeps the build off the image default
# if .nvmrc is ever missing on a branch. Must stay >=22: .npmrc sets engine-strict.
#
# NPM_VERSION is pinned separately because the Node 22 image ships npm 10, and
# npm 10 cannot install this branch at all: resolving the kendo-react-all
# umbrella's 50 exact-version peer dependencies crashes it with
# "Cannot read properties of null (reading 'edgesOut')". Installing with
# --legacy-peer-deps appears to work but silently drops the Kendo suite from 72
# packages to 5, so the build then fails on missing imports instead.
[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "12"

# No client-side router today, so nothing 404s yet. Harmless now, and keeps deep
# links working the day one is added.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
