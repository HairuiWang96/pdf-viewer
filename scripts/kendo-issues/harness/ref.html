<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>pdf.js reference</title></head>
  <body style="margin: 0; background: #fff">
    <canvas id="c"></canvas>
    <script type="module">
      // Plain pdf.js drawing page 1 at CSS scale ?scale (pt -> px), with the
      // canvas at devicePixelRatio. The sharpness reference for #1539.
      import * as pdfjs from 'pdfjs-dist/legacy/build/pdf.mjs';
      import worker from 'pdfjs-dist/legacy/build/pdf.worker.mjs?url';
      pdfjs.GlobalWorkerOptions.workerSrc = worker;
      const q = new URLSearchParams(location.search);
      const doc = await pdfjs.getDocument('/' + q.get('file')).promise;
      const page = await doc.getPage(1);
      const css = Number(q.get('scale'));
      const dpr = devicePixelRatio;
      const vp = page.getViewport({ scale: css * dpr });
      const c = document.getElementById('c');
      c.width = vp.width;
      c.height = vp.height;
      c.style.width = vp.width / dpr + 'px';
      c.style.height = vp.height / dpr + 'px';
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      window.__done = true;
    </script>
  </body>
</html>
